apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autoscale-go
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 10
      containers:
        - image: ghcr.io/knative/autoscale-go:latest
          resources:
            requests:
              cpu: "300m"
              memory: "100Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
